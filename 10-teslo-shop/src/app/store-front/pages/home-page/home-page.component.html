<h1 class="text-3xl font-bold font-Montserrat"> Todos los productos</h1>
<h2 class="3xl">Para todos los gustos</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3 animate-fade-in">
    @for (product of productResource.value()?.products; track $index) {
       <product-card [product]="product"/>
    }
</div>
