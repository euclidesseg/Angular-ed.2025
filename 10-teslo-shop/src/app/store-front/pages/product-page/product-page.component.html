
@if (productResource.isLoading()) {
    <div class="flex justify-center items-center h-screen">
        <span class="loading loading-spinner loading-lg flex">
    
        </span>
    </div>
}

@if (productResource.hasValue()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 py-4 px-4">

        <!-- Imagenes del producto -->
        <product-carrousel [images]="productResource.value().images" />
        <!-- Imagenes del producto -->

        <!-- Contenido del producto -->
         <div>
            <h2 class="text-2xl font-bold font-montserrat">{{productResource.value().title}}</h2>
            <div class="divider">
            </div>
            <p>{{productResource.value().description}}</p>
         </div>
        </div>
}
