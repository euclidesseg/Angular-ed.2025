
<div class="card bg-base-100 shadow-md hover:shadow-xl transition-all duration-300 group overflow-hidden">
    <figure class="relative bg-white h-64 overflow-hidden">
        <img [src]="product().images | productImage" [alt]="product().title" class="w-full h-full object-contain p-5 transition-transform duration-500 group-hover:scale-105"/>
    </figure>
    <div class="card-body gap-3 p-4">
        <h2 class="card-title text-base font-montserrat font-bold line-clamp-2">{{ product().title }}</h2>
        <p class="text-sm text-base-content/65 line-clamp-2">{{ product().description }}</p>
        <div class="card-actions justify-end mt-2">
            <button [routerLink]="['/product', product().slug]" class="btn btn-primary btn-sm px-5">Ver producto <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>
</div>
