<div class="card bg-base-100 shadow-sm">
    <figure>
        <img [src]="baseUrl + '/files/product/' + product().images[0]" [alt]="product().title"/>
    </figure>
    <div class="card-body">
        <h2 class="card-title font-montserrat">{{product().title}}</h2>
        <p>{{product().description | slice:0:100}}...</p>
        <div class="card-actions justify-end">
            <button [routerLink]="['/product', product().slug]" class="btn btn-primary">Detalles</button>
        </div>
    </div>
</div>
